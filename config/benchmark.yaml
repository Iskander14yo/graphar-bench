dataset: ogbn-products
loaders:
  - gar
  # - neo4j-global
  # - neo4j-per-node
  # - pyg-inmem
batch_size: 1024
num_neighbors: [10, 5]   # 2-hop; matches paper's setup
features: [feat]         # Neo4j property name for the feature array
num_features: 100        # benchmark width across loaders
num_runs: 1              # 1 cold + 3 warm
batch_limit: 50          # null to run full epochs
shuffle: false           # false for reproducibility; warm runs become stable
seed: 42
ogb_root: graphar-bench/datasets/ogb
gar_root: graphar-bench/datasets/gar

gar:
  vertex_type: node
  edge_type: edge
  tmp_root: graphar-bench/datasets/tmp/gar_import
  vertex_chunk_size: 1000000
  edge_chunk_size: 10000000
  vertex_write_batch_size: 500000
  edge_write_batch_size: 5000000
  adj_list_ram_for_loader_mb: 3296
  offset_ram_for_loader_mb: 800
  feature_ram_for_loader_mb: 0
  num_samplers: 0
  prefetch_batches: 0      # 0 = auto (= num_samplers, or 1 when num_samplers=0)
  num_readers: 1
  num_stitchers: 1
  feature_cursor_trail_chunks: 10

neo4j:
  uri: bolt://localhost:7687
  database: neo4j        # Community Edition only supports the default 'neo4j' database
  profile_every_n: 50    # run PROFILE on every 50th batch; null to disable
  csv_root: graphar-bench/datasets/neo4j_csv
  skip_import: false
  node_batch_size: 50000
  edge_batch_size: 5000000
  force: false
